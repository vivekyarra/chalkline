<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CHALKLINE Student</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header><div><div class="brand">CHALKLINE</div><div class="tag">The board stays with you.</div></div><span id="connection" class="status">CONNECTING</span></header>
<main><section class="panel"><div class="row" style="justify-content:space-between"><div><h1 style="margin:0">Live board</h1><p class="hint">Amber areas are temporarily hidden. CHALKLINE preserves the last verified board pixels.</p></div><button id="audio">Join audio</button></div>
<div class="board-wrap"><canvas id="board"></canvas><canvas id="stale"></canvas></div>
<div class="history"><div class="row"><strong>History</strong><span id="version" class="muted">Waiting for board…</span><button id="live" class="secondary">Return to live</button></div><input id="timeline" type="range" min="0" max="0" value="0"></div></section></main>
<script type="module">
import {BoardClient,imageFromBase64} from '/static/board.js';
const status=document.querySelector('#connection'), version=document.querySelector('#version'), canvas=document.querySelector('#board'), stale=document.querySelector('#stale'), timeline=document.querySelector('#timeline');
let viewingHistory=false, ws; const board=new BoardClient(canvas,stale,(s,v)=>{if(!viewingHistory){status.textContent=s;status.classList.toggle('off',s!=='LIVE');version.textContent=`Live version ${v}`;timeline.max=v;timeline.value=v;}});
function connect(){ status.textContent='CONNECTING'; ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/board`); ws.onopen=()=>status.textContent='SYNCING'; ws.onmessage=async e=>{const m=JSON.parse(e.data); if(m.type==='checkpoint')await board.checkpoint(m); if(m.type==='patch')await board.patch(m,ws); if(m.type==='freshness'&&!viewingHistory)await board.drawStale(m.stale_mask); if(m.type==='error'){status.textContent='SOURCE ERROR';status.classList.add('off');}}; ws.onclose=()=>{status.textContent='DISCONNECTED';status.classList.add('off');setTimeout(connect,1500)};}
timeline.onchange=async()=>{const v=Number(timeline.value);if(v===board.version)return;const r=await fetch(`/api/history/${v}`);if(!r.ok)return;const item=await r.json(),img=await imageFromBase64(item.image);viewingHistory=true;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);status.textContent='HISTORY';version.textContent=`Viewed ${v} · Live ${board.version}`;};
document.querySelector('#live').onclick=()=>{viewingHistory=false;ws.send(JSON.stringify({type:'resync',version:-1}));};
document.querySelector('#audio').onclick=async()=>{const pc=new RTCPeerConnection(), sock=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/audio`);pc.ontrack=e=>{const a=new Audio();a.srcObject=e.streams[0];a.play();};pc.onicecandidate=e=>e.candidate&&sock.send(JSON.stringify({role:'student',candidate:e.candidate}));sock.onopen=()=>sock.send(JSON.stringify({role:'student',ready:true}));sock.onmessage=async e=>{const m=JSON.parse(e.data);if(m.role==='teacher'&&m.offer){await pc.setRemoteDescription(m.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sock.send(JSON.stringify({role:'student',answer}));}if(m.role==='teacher'&&m.candidate)await pc.addIceCandidate(m.candidate);};document.querySelector('#audio').textContent='Audio ready';};connect();
</script></body></html>
